<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mold Job App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<script src="jspdf.umd.min.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F2A3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mold Jobs">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--ink:#0F2A3A;--ink2:#344B59;--mute:#4A6170;--line:#D5E0E5;--bg:#F3F7F8;--card:#FFFFFF;--acc:#0B6B6A;--acc2:#08504F;--accbg:#E2F2F1;--warn:#8A5A00;--warnbg:#FFF4DB;--bad:#A32020;--badbg:#FBE9E9;--good:#1F6B32;--goodbg:#E5F4E8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:18px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0;line-height:1.15}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 140px}
.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.top .in{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:transparent;border:1.5px solid #6E8796;color:#fff;border-radius:10px;padding:10px 14px;min-height:48px;cursor:pointer;font-weight:600}
.banner{border-radius:12px;padding:14px 16px;margin:12px 0;font-size:16px}
.banner.warn{background:var(--warnbg);color:#5C3D00;border:1px solid #E7C977}
.banner.bad{background:var(--badbg);color:var(--bad);border:1px solid #E9B4B4}
.banner.ok{background:var(--goodbg);color:var(--good);border:1px solid #A9D6B2}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border-radius:14px;border:none;background:var(--acc);color:#fff;font-weight:700;font-size:20px;cursor:pointer}
.big:active{background:var(--acc2)}
.btn{min-height:52px;padding:0 18px;border-radius:12px;border:1.5px solid var(--ink);background:#fff;font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{min-height:44px;font-size:16px;padding:0 14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.card h2{font-size:24px;margin-bottom:6px}
.card h3{font-size:20px;margin:6px 0 10px}
.hint{color:var(--mute);font-size:16px;margin:4px 0 12px}
.fld{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.fld>span{font-weight:600;font-size:16px}
.fld input,.fld select,.fld textarea{width:100%;min-height:52px;padding:12px 14px;border:1.5px solid #9FB3BD;border-radius:10px;background:#fff}
.fld textarea{min-height:110px;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:3px solid #8CD3D1;border-color:var(--acc)}
.areawrap{position:relative}
.mic{position:absolute;right:8px;bottom:8px;width:48px;height:48px;border-radius:24px;border:1.5px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:52px;padding:0 18px;border-radius:12px;border:1.5px solid #9FB3BD;background:#fff;cursor:pointer;font-weight:500}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.tick{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:10px 14px;margin:8px 0;border-radius:12px;border:1.5px solid #9FB3BD;background:#fff;cursor:pointer;text-align:left}
.tick .box{width:30px;height:30px;border-radius:8px;border:2px solid #6E8796;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tick.on{border-color:var(--acc);background:var(--accbg)}
.tick.on .box{background:var(--acc);border-color:var(--acc);color:#fff}
.jobs{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.job{display:flex;gap:14px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;text-align:left;width:100%;min-height:84px}
.job .n{font-size:14px;color:var(--mute);font-weight:600}
.job .nm{font-size:20px;font-weight:700}
.job .nx{font-size:16px;color:var(--ink2)}
.pill{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap}
.p-new{background:#E8EDF0;color:#2F4553}.p-visit{background:#EEE8FA;color:#4B2F86}.p-quote{background:var(--warnbg);color:#6B4700}.p-work{background:#E3EEFB;color:#1D4E89}.p-pay{background:#FBE8F2;color:#8A1F5A}.p-done{background:var(--goodbg);color:var(--good)}.p-lost{background:var(--badbg);color:var(--bad)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs button{min-height:48px;padding:0 16px;border-radius:999px;border:1.5px solid #9FB3BD;background:#fff;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:thin}
.steps button{flex-shrink:0;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid #9FB3BD;background:#fff;font-weight:600;cursor:pointer;font-size:16px;display:flex;align-items:center;gap:8px}
.steps button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps .dot{width:10px;height:10px;border-radius:5px;background:#C4D1D7}
.steps .dot.done{background:#2E9E5B}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:6}
.bar .in{max-width:900px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center}
.bar .btn{flex:1;min-height:60px;font-size:19px}
.saved{font-size:14px;color:var(--mute);min-width:70px;text-align:center}
table.lines{width:100%;border-collapse:collapse}
table.lines td{padding:6px 4px;vertical-align:top}
table.lines input{width:100%;min-height:52px;padding:10px 12px;border:1.5px solid #9FB3BD;border-radius:10px}
.fld input.bad,table.lines input.bad{border-color:var(--bad);background:var(--badbg)}.moneyerr{color:var(--bad);font-size:15px;font-weight:600}.moneyerr:empty{display:none}
.total{font-size:26px;font-weight:700;font-family:"Space Grotesk",sans-serif}
.msg{background:var(--accbg);border:1px solid #A8D8D6;border-radius:14px;padding:16px;margin:14px 0}
.msg .t{font-weight:700;font-size:16px;margin-bottom:6px}
.msg .b{white-space:pre-wrap;font-size:17px;margin-bottom:12px}
.result{border-radius:14px;padding:16px;font-size:18px;font-weight:600;margin:12px 0}
.result.green{background:var(--goodbg);color:var(--good)}.result.yellow{background:var(--warnbg);color:#5C3D00}.result.red{background:var(--badbg);color:var(--bad)}.result.none{background:#E8EDF0;color:#2F4553}
.sig{border:2px dashed #9FB3BD;border-radius:12px;background:#fff;touch-action:none;width:100%;height:170px;display:block}
.sigimg{border:1px solid var(--line);border-radius:12px;background:#fff;max-width:100%;height:150px;object-fit:contain;display:block}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff;cursor:pointer;width:100%;text-align:left;min-height:64px}
.empty{color:var(--mute);text-align:center;padding:40px 12px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:20;font-weight:600;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(15,42,58,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box2{background:#fff;border-radius:16px;padding:22px;max-width:520px;width:100%}
.contract{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;max-height:340px;overflow:auto;font-size:16px}
@media (max-width:560px){html,body{font-size:17px}.top h1{font-size:19px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
// ---------- state ----------
var db=null, dict=null, dl=null;
var jobs={}, settings={}, crew={};
var view={name:"home",filter:"active",q:""};
var cur=null; // working copy of open job
var curCrew=null;
var saveTimer=null, saving=false, pendingSave=false, saveNote="";
var loaded=false, offline=false, writeBlocked=false;
var micPath=null;

var STEPS=[
 {k:"customer",t:"Customer"},
 {k:"screen",t:"Screening"},
 {k:"visit",t:"Site visit"},
 {k:"quote",t:"Quote"},
 {k:"agree",t:"Agreement"},
 {k:"changes",t:"Changes"},
 {k:"logs",t:"Work days"},
 {k:"finish",t:"Finish"},
 {k:"pay",t:"Payment"}
];
var COUNTIES=["Montgomery","Prince George's","Frederick","Howard","Other"];
var LINE_DEFAULTS=["Containment and protection","Negative pressure setup and monitoring","Removal of affected materials","HEPA vacuum and cleaning","Bagging, hauling and disposal"];
var START_CHECKS=[["scope","Approved quote on hand"],["access","Access arranged with customer"],["safety","Safety talk done"],["ppe","PPE and respirators checked"],["cont","Containment checked, zipper door closed"],["neg","Negative pressure running"],["equip","Equipment inspected"],["occ","People in the home know which areas are off limits"]];
var END_CHECKS=[["secure","Work area secured"],["cont2","Containment checked"],["equip2","Equipment status noted"],["next","Tomorrow's tasks written down"],["inc","Incident record done (if anything happened)"]];
var FINISH_CHECKS=[["removal","All agreed removal done"],["clean","Cleaning done"],["review","Work area looked over, anything left written down"],["waste","Waste removed and record saved"],["photos","Photos and readings saved in CaseLens Pro"],["tester","Independent tester scheduled"],["plastic","Plastic comes down only when the testing plan allows"],["inv","All equipment accounted for"],["summary","Customer given the completion summary"]];
var TRAIN=[["cont","Containment and negative pressure"],["remove","Safe removal and dust control"],["clean","Cleaning and keeping contamination contained"],["ppe","PPE and respirator rules"],["sds","Product labels and safety data sheets"],["tools","Tools, electrical and ladder safety"],["waste","Waste handling and equipment cleaning"],["home","Photos, logs and respecting the customer's home"],["stop","When to stop work and how to report an incident"]];

// ---------- helpers ----------
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function get(o,p){var a=p.split(".");for(var i=0;i<a.length;i++){if(o==null)return undefined;o=o[a[i]];}return o;}
function set(o,p,v){var a=p.split(".");for(var i=0;i<a.length-1;i++){var k=a[i];if(o[k]==null||typeof o[k]!=="object")o[k]=/^\d+$/.test(a[i+1])?[]:{};o=o[k];}o[a[a.length-1]]=v;}
function money(n){n=num(n);var c=Math.round(Math.abs(n)*100)%100!==0;return (n<0?"-$":"$")+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:c?2:0,maximumFractionDigits:2});}
function parseCents(v){
 if(v==null)return 0;
 if(typeof v==="number")return isFinite(v)?Math.round(v*100):null;
 var t=String(v).trim();if(t==="")return 0;
 var neg=false;
 if(/^\(.*\)$/.test(t)){neg=true;t=t.slice(1,-1).trim();}
 if(t.charAt(0)==="-"){neg=!neg;t=t.slice(1).trim();}
 if(t.charAt(0)==="$"){t=t.slice(1).trim();}
 if(t.charAt(0)==="-"){neg=!neg;t=t.slice(1).trim();}
 if(!/^((\d{1,3}(,\d{3})+)|\d+)?(\.\d{1,2})?$/.test(t)||t===""||t===".")return null;
 t=t.replace(/,/g,"");var parts=t.split(".");
 var c=parseInt(parts[0]||"0",10)*100+(parts[1]?parseInt((parts[1]+"0").slice(0,2),10):0);
 return neg?-c:c;
}
function num(v){var c=parseCents(v);return c==null?0:c/100;}
function moneyOk(v){return parseCents(v)!==null;}
function cents(v){var c=parseCents(v);return c==null?0:c;}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function nice(d){if(!d)return "";var p=d.split("-");if(p.length!==3)return d;var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return m[+p[1]-1]+" "+(+p[2])+", "+p[0];}
function clone(o){return JSON.parse(JSON.stringify(o||{}));}
function co(){return settings.name||"[Company Name]";}
function toast(t){var el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(function(){el.remove();},2600);}

// ---------- calculations ----------
function quoteCents(j){var s=0;(get(j,"quote.lines")||[]).forEach(function(l){s+=cents(l.price);});return s;}
function quoteTotal(j){return quoteCents(j)/100;}
function changesCents(j){var s=0;(j.changes||[]).forEach(function(c){if(c.custSig)s+=cents(c.frozen?c.frozen.amount:c.amount);});return s;}
function changesTotal(j){return changesCents(j)/100;}
function jobCents(j){return quoteCents(j)+changesCents(j);}
function jobTotal(j){return jobCents(j)/100;}
function paidCents(j){var s=0;(get(j,"pay.payments")||[]).forEach(function(p){s+=cents(p.amount);});return s;}
function paidTotal(j){return paidCents(j)/100;}
function balance(j){return (jobCents(j)-paidCents(j))/100;}
function moneyErrors(j){var e=[];(get(j,"quote.lines")||[]).forEach(function(l,i){if(!moneyOk(l.price))e.push("Quote line "+(i+1));});if(!moneyOk(get(j,"agree.deposit")))e.push("Deposit");(j.changes||[]).forEach(function(c,i){if(!moneyOk(c.amount))e.push("Change "+(i+1));});(get(j,"pay.payments")||[]).forEach(function(p,i){if(!moneyOk(p.amount))e.push("Payment "+(i+1));});return e;}
function screenResult(j){
 var s=j.screen||{};
 var keys=["owner","area","photos","timing","fixed","fee"];
 var answered=keys.filter(function(k){return s[k];}).length;
 if(s.area==="no"||s.fee==="no"||s.timing==="no"||s.owner==="no")return "red";
 if(answered<keys.length)return answered?"yellow":"none";
 if(keys.every(function(k){return s[k]==="yes";}))return "green";
 return "yellow";
}
function stageOf(j){
 if(j.lost)return {t:"Lost / not a fit",c:"p-lost",step:0};
 if(screenResult(j)==="red")return {t:"Not a fit",c:"p-lost",step:1};
 var qt=quoteTotal(j);
 if(get(j,"agree.custSig")){
  if(inCancel(j))return {t:"Cancel period",c:"p-quote",step:4};
  if(!get(j,"finish.date"))return {t:"Work in progress",c:"p-work",step:6};
  if(jobTotal(j)>0&&balance(j)<=0)return {t:"Paid / closed",c:"p-done",step:8};
  return {t:"Waiting on payment",c:"p-pay",step:8};
 }
 if(qt>0)return get(j,"quote.sentDate")?{t:"Quote sent",c:"p-quote",step:4}:{t:"Writing quote",c:"p-quote",step:3};
 if(get(j,"visit.date"))return {t:"Site visit booked",c:"p-visit",step:2};
 if(screenResult(j)==="green")return {t:"Ready to book visit",c:"p-visit",step:2};
 return {t:"New call",c:"p-new",step:1};
}
function nextAction(j){
 var st=stageOf(j).t, r=screenResult(j);
 if(j.lost||st==="Not a fit")return "No further action";
 if(!get(j,"customer.name")||!get(j,"customer.phone"))return "Finish customer info";
 if(r!=="green")return r==="yellow"?"Waiting on screening answers":"Ask the screening questions";
 if(!get(j,"visit.date"))return "Book the site visit";
 if(!quoteTotal(j))return "Write the quote";
 if(!get(j,"quote.approved"))return "Owner approves the quote";
 if(!get(j,"quote.sentDate"))return "Send the quote";
 if(!get(j,"customer.payType"))return "Pick insurance or self-pay";
 if(!get(j,"agree.custSig"))return "Get the agreement signed";
 if(isIns(j)&&!get(j,"agree.dtpSig"))return "Get the Direction to Pay signed";
 if(inCancel(j))return "Wait until after "+nice(cancelEnds(j))+" to start or take money";
 if(!get(j,"finish.date"))return "Log today's work";
 if(balance(j)>0)return "Collect "+money(balance(j));
 return "Ask for a Google review";
}
function stepDone(j,k){
 switch(k){
  case "customer":return !!(get(j,"customer.name")&&get(j,"customer.phone")&&get(j,"customer.address"));
  case "screen":return screenResult(j)==="green";
  case "visit":return !!get(j,"visit.date")&&!!get(j,"visit.seen");
  case "quote":return quoteTotal(j)>0&&!!get(j,"quote.approved");
  case "agree":return !!get(j,"agree.custSig")&&!!get(j,"agree.coSig");
  case "changes":return (j.changes||[]).length>0&&(j.changes||[]).every(function(c){return c.custSig;});
  case "logs":return (j.logs||[]).length>0;
  case "finish":return !!get(j,"finish.date");
  case "pay":return jobTotal(j)>0&&balance(j)<=0;
 }
 return false;
}

// ---------- message templates ----------
function fill(t,j){
 var c=j.customer||{};
 return t.replace(/\[Name\]/g,(c.name||"").split(" ")[0]||"there").replace(/\[Company\]/g,co()).replace(/\[Address\]/g,c.address||"your property").replace(/\[Fee\]/g,settings.fee?money(settings.fee):"$[fee]").replace(/\[Phone\]/g,settings.phone||"[phone]").replace(/\[Day\]/g,nice(get(j,"visit.date"))||"[day]").replace(/\[Time\]/g,get(j,"visit.time")||"[time]").replace(/\[Total\]/g,money(jobTotal(j))).replace(/\[Valid\]/g,nice(get(j,"quote.validUntil"))||"[date]").replace(/\[Start\]/g,nice(get(j,"agree.startDate"))||"[date]").replace(/\[Tester\]/g,get(j,"quote.tester")||settings.tester||"the independent tester").replace(/\[Job\]/g,j.num||"").replace(/\[Balance\]/g,money(balance(j))).replace(/\[Review\]/g,settings.review||"[review link]");
}
var MSG={
 first:"Hi [Name], this is [Company]. Thanks for reaching out about the mold at [Address]. To get you on the schedule, please reply with 2 or 3 photos of the area. We'll send visit times right after.",
 nudge:"Hi [Name], just checking in. We still need a few photos of the area before we can book your inspection. Reply here anytime.",
 notfit:"Thanks for contacting [Company]. This one is outside what we do, so we're not the right company for it. We wish you the best getting it taken care of.",
 booked:"You're booked for [Day] at [Time] at [Address]. The [Fee] inspection fee comes off your bill if you hire us. Please make sure we can get to the area, and keep pets put away.",
 quote:"Hi [Name], your written quote for [Address] is attached. It lists exactly what we'll remove and clean, how long it should take, and what isn't included. The total is [Total]. Reply or call [Phone] with any questions.",
 quoteFollow:"Hi [Name], your quote is good until [Valid]. Reply YES and we'll send the agreement and open dates.",
 signed:"Thanks, [Name]. Your start date is [Start]. Our crew will seal off the work area and keep machines running the whole time. Call [Phone] with any questions.",
 change:"Hi [Name], we found more than expected. Before doing any extra work we need your OK on the change. We'll go over the photos and the new total with you.",
 done:"We've finished the removal and cleaning at [Address]. [Tester] will contact you to schedule the independent check. The plastic stays up until then.",
 invoice:"Your invoice for job [Job] is attached. The balance is [Balance]. Thank you for choosing [Company].",
 paid:"Payment received, thank you. If you were happy with our work, a quick Google review helps a small business a lot: [Review]"
};
function msgCard(title,key,j){
 var t=fill(MSG[key],j);
 var ph=(get(j,"customer.phone")||"").replace(/[^0-9+]/g,"");
 return '<div class="msg"><div class="t">Text to send: '+esc(title)+'</div><div class="b">'+esc(t)+'</div><div class="row"><button class="btn sm pri" data-act="copy" data-text="'+esc(t)+'">Copy text</button>'+(ph?'<a class="btn sm" style="display:inline-flex;align-items:center;text-decoration:none;color:inherit" href="sms:'+esc(ph)+'?&body='+encodeURIComponent(t)+'">Open in Messages</a><span class="hint" style="margin:0">'+esc(get(j,"customer.phone"))+'</span>':'')+'</div></div>';
}

// ---------- field builders ----------
function moneyMsg(v){return moneyOk(v)?'':'Not a valid amount. Type it like 1250, 1,250.50 or -200.';}
function fText(label,p,o){o=o||{};var v=get(cur,p);var bad=o.money&&!moneyOk(v);return '<label class="fld"><span>'+esc(label)+'</span><input data-f="'+p+'"'+(o.money?' data-money="1"':'')+(bad?' class="bad"':'')+' type="'+(o.type||"text")+'"'+(o.im?' inputmode="'+o.im+'"':'')+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+' value="'+esc(v==null?"":v)+'">'+(o.money?'<span class="moneyerr">'+esc(bad?moneyMsg(v):'')+'</span>':'')+'</label>';}
function fArea(label,p,o){o=o||{};var v=get(cur,p);return '<label class="fld"><span>'+esc(label)+'</span><div class="areawrap"><textarea data-f="'+p+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+'>'+esc(v||"")+'</textarea>'+(dict?'<button type="button" class="mic'+(micPath===p?' on':'')+'" data-act="mic" data-f="'+p+'" aria-label="Talk to type">'+micIcon()+'</button>':'')+'</div></label>';}
function fSeg(label,p,opts){var v=get(cur,p);return '<div class="fld"><span>'+esc(label)+'</span><div class="seg">'+opts.map(function(op){var val=Array.isArray(op)?op[0]:op, lab=Array.isArray(op)?op[1]:op;return '<button type="button" class="'+(v===val?'on':'')+'" data-act="pick" data-f="'+p+'" data-v="'+esc(val)+'">'+esc(lab)+'</button>';}).join("")+'</div></div>';}

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function newId(prefix){try{if(window.crypto&&crypto.randomUUID)return prefix+crypto.randomUUID().replace(/-/g,"");if(window.crypto&&crypto.getRandomValues){var a=new Uint8Array(16);crypto.getRandomValues(a);return prefix+Array.prototype.map.call(a,function(b){return ("0"+b.toString(16)).slice(-2);}).join("");}}catch(e){}return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,12);}
function nthWeekday(y,m,wd,n){var d=new Date(y,m,1);var c=0;while(true){if(d.getDay()===wd){c++;if(c===n)return new Date(d);}d.setDate(d.getDate()+1);}}
function lastWeekday(y,m,wd){var d=new Date(y,m+1,0);while(d.getDay()!==wd)d.setDate(d.getDate()-1);return d;}
var holCache={};
function mdHolidays(y){
 if(holCache[y])return holCache[y];
 var list=[new Date(y,0,1),nthWeekday(y,1,1,3),lastWeekday(y,4,1),new Date(y,6,4),nthWeekday(y,8,1,1),nthWeekday(y,9,1,2),new Date(y,10,11),nthWeekday(y,10,4,4),new Date(y,11,25)];
 var out={};
 list.forEach(function(d){out[ymd(d)]=1;var w=d.getDay();if(w===6){var f=new Date(d);f.setDate(f.getDate()-1);out[ymd(f)]=1;}if(w===0){var m=new Date(d);m.setDate(m.getDate()+1);out[ymd(m)]=1;}});
 holCache[y]=out;return out;
}

function agreementText(j){

 var start=nice(get(j,"agree.startDate"))||"________", end=nice(get(j,"agree.endDate"))||"________";
 var t=[];
 t.push((ins?"WORK AUTHORIZATION AND AGREEMENT (INSURANCE JOB)":"MOLD REMEDIATION CONTRACT (SELF-PAY)"));
 t.push(c+" · "+B(settings.address)+" · "+B(settings.phone)+" · MHIC License #"+B(settings.mhic));

 t.push("");
 t.push("1. THE WORK\n"+c+" (\"we\") will do the mold remediation work in the attached written quote for job "+B(j.num)+", which is part of this agreement: containment, negative air pressure, removal of the affected materials listed, HEPA vacuuming, cleaning, and bagging and hauling away the waste. Only the work and areas listed in the quote are included.\nNot included: rebuilding (drywall, paint, flooring, trim); fixing the leak or water source; lead or asbestos work; contents cleaning; and hidden areas we could not see, unless added in writing.");

  t.push("4. YOUR INSURANCE CLAIM\nYour claim stays yours. We will give you, and your insurance company if you ask us to, our estimate, photos, moisture readings, reports and invoices for this work, and answer the insurer's questions about the work we did. We do not negotiate your claim, interpret your policy, or argue coverage for you. Only you, your attorney or a licensed public adjuster can do that. If we find more damage your insurance may cover, we stop that part of the work, show you photos, and send you and your insurer a written supplement. We do not do the extra work until you sign a Change Order. If you tell us to go ahead before the insurer approves it, you are responsible for paying for it if the insurer says no. You agree to sign the Direction to Pay so the insurer includes us on payments for our work.");

 } else {

 }

function subBack(label){return '<button class="btn sm" data-act="subback" style="margin-top:12px">‹ '+esc(label)+'</button>';}
function renderChange(j,i){
 var p="changes."+i+".", ok=true, c0=j.changes[i], clock=!!c0.frozen;
 var h=subBack("All changes")+(clock?'<div class="banner ok">Signed. This change is locked. To change it, void it under the signatures and have it signed again.</div>':'')+lockStart(clock)+'<div class="card"><h2>Change '+(i+1)+'</h2>';
 h+=fText("Date",p+"date",{type:"date"});
 h+=fArea("What we found and why the change is needed",p+"reason");
 h+=fArea("Work added, removed or changed",p+"work");
 h+='<div class="grid2">'+fText("Amount added (+) or taken off (-)",p+"amount",{money:true,im:"decimal",ph:"500 or -200"})+fText("New finish date",p+"finishDate",{type:"date"})+'</div>';
 h+='<p class="hint">Job total before: '+money(clock?c0.frozen.totalBefore:jobTotal(j))+' · After this change: <b>'+money((clock?c0.frozen.totalBefore:jobTotal(j))+num(clock?c0.frozen.amount:c0.amount))+'</b></p>';
 h+=fSeg("Does it change containment, access or testing?",p+"affects",["No","Yes"]);
 h+='</div>'+lockEnd(clock)+'<div class="card"><h3>Signatures before the extra work</h3>'+fSig("Customer",p+"custSig",!ok)+fSig("Company representative",p+"coSig",!ok)+'<button class="btn pri" data-act="pdf" data-v="change" data-i="'+i+'"'+(j.changes[i].custSig?'':' disabled')+'>Download change (PDF)</button></div>';
 h+=msgCard("change needed","change",j);
 return h;
}
function renderLog(j,i){
 var p="logs."+i+".";
 var h=subBack("All work days")+'<div class="card"><h2>Work day</h2><div class="grid2">'+fText("Date",p+"date",{type:"date"})+fText("Crew lead",p+"lead")+'</div>'+fText("Crew on site, arrival and leave times",p+"crew")+'</div>';
 h+='<div class="card"><h3>Start of day</h3>';START_CHECKS.forEach(function(c){h+=fTick(c[1],p+"start."+c[0]);});h+=fArea("Problems found at start and what we did",p+"startNotes")+'</div>';
 h+='<div class="card"><h3>During the day</h3>'+fArea("Work done today: what was removed, what was cleaned",p+"work")+fText("Equipment running (ID numbers and where)",p+"equip")+fText("Products used",p+"products")+fText("Waste: how many bags, where it went",p+"waste")+fArea("Anything unexpected, any damage, complaint or work stop",p+"unexpected")+fText("What we told the customer, when, and to whom",p+"update")+'</div>';
 h+='<div class="card"><h3>End of day</h3>';END_CHECKS.forEach(function(c){h+=fTick(c[1],p+"end."+c[0]);});h+=fArea("Work left / plan for tomorrow",p+"tomorrow")+fTick("Crew lead signs off on this day",p+"signoff")+'</div>';
 return h;
}
function renderIncident(j,i){
 var p="incidents."+i+".";
 var h=subBack("Back to work days")+'<div class="card"><h2>Incident record</h2><p class="hint">Write only what happened. Do not guess at causes or admit fault.</p>';
 h+=fText("Date, time and where",p+"when")+fArea("What happened and who was involved",p+"what")+fArea("What we did right away (first aid, 911, made it safe)",p+"steps")+fSeg("Was work stopped?",p+"stopped",["Yes","No"])+fText("Who was told, and when",p+"notified")+fText("Photos and witnesses",p+"photos")+fSeg("Does the insurance company need to be told?",p+"insurer",["Yes","No","Not sure"])+fArea("What must happen before work restarts, and who approves",p+"restart")+'</div>';

}

function bindSigs(){
 app.querySelectorAll("canvas.sig").forEach(function(cv){
  var ctx=cv.getContext("2d"), drawing=false, last=null;
  ctx.lineWidth=3.2;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#0F2A3A";
  cv._blank=true;
  function pt(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};}
  cv.addEventListener("pointerdown",function(e){drawing=true;last=pt(e);cv.setPointerCapture(e.pointerId);e.preventDefault();});
  cv.addEventListener("pointermove",function(e){if(!drawing)return;var p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;cv._blank=false;});
  function up(){drawing=false;}
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
 });
}
